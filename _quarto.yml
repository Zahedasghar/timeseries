project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
    - outline.qmd
    - lectures/*.qmd
    - labs/*.qmd
    - labs/r-foundations/*.qmd
    - "!_archive/**"
    - "!applications/**"
    - "!assessments/**"
    - "!slides/**"
    - "!references/**"
    - "!R/**"
    - "!shiny/**"
  resources:
    - assets/images/**

execute:
  freeze: auto
  warning: false
  message: false

website:
  title: "Time Series Econometrics & Macroeconomic Forecasting"
  description: "EC614 — Prof. Dr. Zahid Asghar, School of Economics, Quaid-i-Azam University, Islamabad"
  site-url: https://zahedasghar.github.io/timeseries/
  repo-url: https://github.com/Zahedasghar/timeseries
  repo-actions: [source, issue]
  favicon: assets/images/fpp3.png
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: primary
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: outline.qmd
        text: Course outline
      - href: lectures/index.qmd
        text: Lectures
      - href: labs/index.qmd
        text: Labs
    right:
      - icon: github
        href: https://github.com/Zahedasghar/timeseries
        aria-label: GitHub repository
      - icon: globe
        href: https://zahidasghar.com
        aria-label: zahidasghar.com
  sidebar:
    - id: lectures
      title: "Lectures"
      style: floating
      collapse-level: 2
      contents:
        - lectures/index.qmd
        - section: "Foundations"
          contents:
            - lectures/01-course-overview.qmd
            - lectures/02-stationarity-and-nonstationarity.qmd
            - lectures/03-nonstationary-series.qmd
            - lectures/04-unit-root-tests.qmd
            - lectures/05-spurious-regression.qmd
        - section: "Univariate modelling and forecasting"
          contents:
            - lectures/06-arima-modelling.qmd
            - lectures/07-forecast-uncertainty-and-evaluation.qmd
            - lectures/08-volatility-arch-garch.qmd
        - section: "Multivariate and long-run relationships"
          contents:
            - lectures/09-cointegration-and-vecm.qmd
            - lectures/10-ardl-and-bounds-testing.qmd
            - lectures/11-vector-autoregressions.qmd
            - lectures/12-structural-var.qmd
            - lectures/13-svar-macro-forecasting.qmd
        - section: "Panel data"
          contents:
            - lectures/14-panel-data-models.qmd
  page-footer:
    background: light
    left: "© Prof. Dr. Zahid Asghar · School of Economics, Quaid-i-Azam University"
    right:
      - icon: github
        href: https://github.com/Zahedasghar/timeseries
      - icon: globe
        href: https://zahidasghar.com

format:
  html:
    theme: [cosmo, assets/theme.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-link: true
    df-print: paged
    smooth-scroll: true
    link-external-newwindow: true
    citations-hover: true
    fig-align: center
    fig-width: 8
    fig-height: 4.5
